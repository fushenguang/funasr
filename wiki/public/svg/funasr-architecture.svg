<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img">
  <title>FunASR Docker Compose Deployment Architecture</title>
  <style>
    text { font-family: "Inter", -apple-system, "system-ui", "Segoe UI", Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .band-label { font-size: 12px; font-weight: 400; fill: #6B6A66; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="420" fill="#FCFAF5"/>

  <!-- Docker Host band -->
  <rect x="40" y="10" width="600" height="400" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="band-label" x="340" y="32" text-anchor="middle">Docker Host</text>

  <!-- Client entry (purple) -->
  <rect x="60" y="55" width="140" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="th" x="130" y="74" text-anchor="middle" fill="#3C3489">Client</text>
  <text class="ts" x="130" y="92" text-anchor="middle" fill="#534AB7">HTTP / WebSocket</text>

  <!-- Arrow: Client -> Nginx -->
  <line x1="200" y1="77" x2="206" y2="77" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Nginx gateway (teal) -->
  <rect x="210" y="55" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="th" x="310" y="74" text-anchor="middle" fill="#085041">Nginx :80</text>
  <text class="ts" x="310" y="92" text-anchor="middle" fill="#0F6E56">Gateway / Auth / LB</text>

  <!-- Branch arrows: Nginx down then split left and right -->
  <line x1="310" y1="99" x2="310" y2="115" stroke="#898781" stroke-width="1.5"/>
  <line x1="160" y1="115" x2="460" y2="115" stroke="#898781" stroke-width="1.5"/>
  <line x1="160" y1="115" x2="160" y2="133" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="115" x2="460" y2="133" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API container (blue) -->
  <rect x="60" y="140" width="200" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="th" x="160" y="162" text-anchor="middle" fill="#0C447C">funasr-api :8000</text>
  <text class="ts" x="160" y="182" text-anchor="middle" fill="#185FA5">SenseVoice . least_conn</text>

  <!-- WS container (blue) -->
  <rect x="360" y="140" width="200" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="th" x="460" y="162" text-anchor="middle" fill="#0C447C">funasr-ws :10095</text>
  <text class="ts" x="460" y="182" text-anchor="middle" fill="#185FA5">2pass . ip_hash</text>

  <!-- Arrows down to Models -->
  <line x1="160" y1="200" x2="160" y2="216" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="200" x2="460" y2="216" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Models layer (amber) -->
  <rect x="40" y="224" width="600" height="52" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <rect x="140" y="234" width="340" height="36" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text class="th" x="310" y="255" text-anchor="middle" fill="#633806">models/ . ModelScope Hub Cache</text>

  <!-- Volumes band -->
  <rect x="40" y="290" width="600" height="52" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text class="band-label" x="340" y="312" text-anchor="middle">Mounted Volumes</text>
  <rect x="76" y="318" width="140" height="28" rx="6" fill="#F1EFE8" stroke="#A8A69E" stroke-width="1"/>
  <text class="th" x="146" y="334" text-anchor="middle" fill="#4A4945">./models</text>
  <rect x="230" y="318" width="140" height="28" rx="6" fill="#F1EFE8" stroke="#A8A69E" stroke-width="1"/>
  <text class="th" x="300" y="334" text-anchor="middle" fill="#4A4945">./logs</text>
  <rect x="384" y="318" width="140" height="28" rx="6" fill="#F1EFE8" stroke="#A8A69E" stroke-width="1"/>
  <text class="th" x="454" y="334" text-anchor="middle" fill="#4A4945">nginx/</text>

  <!-- GPU box (green) -->
  <rect x="60" y="360" width="200" height="44" rx="8" fill="#E7F4E4" stroke="#3B8A44" stroke-width="1"/>
  <text class="th" x="160" y="379" text-anchor="middle" fill="#245C2A">NVIDIA GPU</text>
  <text class="ts" x="160" y="397" text-anchor="middle" fill="#3B8A44">CUDA Inference</text>

  <!-- log-rotate (gray) -->
  <rect x="360" y="360" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#A8A69E" stroke-width="1"/>
  <text class="th" x="460" y="379" text-anchor="middle" fill="#4A4945">log-rotate</text>
  <text class="ts" x="460" y="397" text-anchor="middle" fill="#6B6A66">Log Rotation Daemon</text>
</svg>