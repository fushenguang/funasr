<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" role="img">
  <title>FunASR OpenAI Compatible 接口流程</title>
  <desc>Client SDK → Nginx 统一网关 → FunASR 服务端的数据流</desc>
  <style>
    text { font-family: "Inter", -apple-system, "system-ui", "Segoe UI", Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="140" fill="#FCFAF5"/>

  <!-- Box 1: Client SDK (purple) -->
  <rect x="70" y="40" width="168" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text class="th" x="154" y="62" text-anchor="middle" dominant-baseline="central" fill="#3C3489">客户端 SDK</text>
  <text class="ts" x="154" y="82" text-anchor="middle" dominant-baseline="central" fill="#534AB7">OpenAI Python / JS</text>

  <!-- Arrow -->
  <line x1="238" y1="70" x2="250" y2="70" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Nginx (teal) -->
  <rect x="256" y="40" width="168" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central" fill="#085041">Nginx :80</text>
  <text class="ts" x="340" y="82" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">认证注入 · 路由</text>

  <!-- Arrow -->
  <line x1="424" y1="70" x2="436" y2="70" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3: FunASR Server (blue) -->
  <rect x="442" y="40" width="168" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text class="th" x="526" y="62" text-anchor="middle" dominant-baseline="central" fill="#0C447C">funasr-server :8000</text>
  <text class="ts" x="526" y="82" text-anchor="middle" dominant-baseline="central" fill="#185FA5">SenseVoice ASR 推理</text>
</svg>