name: funasr

# ============================================================
# FunASR 生产部署
#
# 两个服务都用同一个镜像，直接调用官方命令：
#   funasr-api: funasr-server CLI (官方内置，pip install funasr 即有)
#   funasr-ws:  官方 funasr_wss_server.py (从 pip 包内提取)
#
# 扩展: docker compose up -d --scale funasr-api=2
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            capabilities: [gpu]

services:

  # ── Nginx 统一入口 ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - funasr-api
      - funasr-ws
      - cosyvoice-tts
    healthcheck:
      # 💡 修复点：把 /health 改为 /
      # wget -q -O /dev/null 表示静默请求并丢弃输出，只要 HTTP 状态码是 200 就返回成功
      # 部署服务器实测复现：nginx/conf.d/funasr.conf 只 `listen 80;`，没有
      # `listen [::]:80;`，但容器内 wget 解析 "localhost" 时优先拿到 ::1
      # （IPv6），导致连到一个 nginx 根本没监听的地址上被拒绝
      # （Connection refused），健康检查因此持续 unhealthy，即使 nginx 本身
      # 完全正常（用 127.0.0.1 直连能拿到 200）。显式写 127.0.0.1 强制走
      # IPv4，避开这个解析歧义，不依赖容器 /etc/hosts 里 localhost 的顺序。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend

  # ── HTTP API（官方 funasr-server CLI）────────────────────────
  funasr-api:
    <<: *gpu
    build:
      context: ./services/funasr
      dockerfile: Dockerfile
    image: funasr:${FUNASR_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8000"
    volumes:
      - ./models:/root/.cache/modelscope/hub   # modelscope 默认缓存路径
      - ./logs/api:/app/logs
    environment:
      - MODELSCOPE_CACHE=/root/.cache/modelscope/hub
      - VLLM_API_KEY=${FUNASR_API_KEY:-funasr-internal}
    # 官方命令: funasr-server --device cuda
    # model=sensevoice 是官方默认值，文档确认正确
    command: >-
      funasr-server
      --model sensevoice
      --device ${FUNASR_DEVICE:-cuda}
      --port 8000
      --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - backend

  # ── WebSocket 实时流（官方 funasr_wss_server.py）─────────────
  funasr-ws:
    <<: *gpu
    build:
      context: ./services/funasr
      dockerfile: Dockerfile
    image: funasr:${FUNASR_VERSION:-latest}
    ports:
      - "${WS_PORT:-10095}:10095"
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "10095"
    volumes:
      - ./models:/root/.cache/modelscope/hub
      - ./logs/runtime:/app/logs
    environment:
      - MODELSCOPE_CACHE=/root/.cache/modelscope/hub
    command:
      - sh
      - -c
      - |
        sh /opt/ensure_wss_server.sh &&
        exec python /opt/funasr_wss_server.py \
          --port 10095 \
          --asr_model "$${WS_ASR_MODEL:-iic/SenseVoiceSmall}" \
          --asr_model_online "$${WS_ASR_ONLINE_MODEL:-iic/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online}" \
          --punc_model "$${WS_PUNC_MODEL:-iic/punc_ct-transformer_zh-cn-common-vocab272727-pytorch}" \
          --ngpu 1 \
          --device "$${FUNASR_DEVICE:-cuda}" \
          --certfile "" \
          --keyfile ""
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;s=socket.socket();s.settimeout(3);s.connect(('localhost',10095));s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - backend

  # ── CosyVoice2 TTS（自建 OpenAI 兼容 /v1/audio/speech）────────
  cosyvoice-tts:
    <<: *gpu
    build:
      context: ./services/cosyvoice
      dockerfile: Dockerfile
    image: cosyvoice:${COSYVOICE_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8100"
    volumes:
      - ./models:/root/.cache/modelscope/hub   # 与 funasr-api/ws 共用同一份 modelscope 缓存卷
      - ./voices:/opt/voices:ro                # 服务端预注册命名音色的参考音频（只读）
      - ./logs/tts:/app/logs
    environment:
      - MODELSCOPE_CACHE=/root/.cache/modelscope/hub
      - LOG_LEVEL=${LOG_LEVEL:-INFO}           # server.py 读这个变量，不传的话 .env 里改级别不生效
      - COSYVOICE_DEVICE=${FUNASR_DEVICE:-cuda}
      - COSYVOICE_MODEL_DIR=${COSYVOICE_MODEL_DIR:-/root/.cache/modelscope/hub/iic_CosyVoice2-0.5B}
      # 命名音色 "xiaoxi"：server.py 按 <NAME>_PROMPT_WAV / <NAME>_PROMPT_TEXT
      # 成对扫描环境变量自动注册，新增音色只需追加一对同名变量，无需改代码
      - XIAOXI_PROMPT_WAV=${XIAOXI_PROMPT_WAV:-/opt/voices/xiaoxi_16k.wav}
      - XIAOXI_PROMPT_TEXT=${XIAOXI_PROMPT_TEXT:-}
      # 首包延迟优化：首片最大字符数上限，<=0 关闭优化退回原行为。见 server.py
      # 文件头部说明与 wiki guide/tts-cosyvoice.mdx「首包延迟优化」实测表格
      - TTS_FIRST_CHUNK_MAX_CHARS=${TTS_FIRST_CHUNK_MAX_CHARS:-15}
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s   # CosyVoice2 模型加载 + 音色注册预留时间，参照 funasr-ws 的量级

  # ── 日志轮转 ────────────────────────────────────────────────
  log-rotate:
    image: nginx:1.27-alpine   # 复用已有镜像，避免额外拉取
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          find /logs -name "*.log" -size +100M -exec sh -c 'mv "$$1" "$$1.$(date +%Y%m%d%H%M%S)" && touch "$$1"' _ {} \;
          find /logs -name "*.log.*" -mtime +${LOG_RETENTION_DAYS:-30} -delete
          sleep 3600
        done
    volumes:
      - ./logs:/logs
    networks: []

networks:
  frontend:
    name: funasr_frontend
  backend:
    name: funasr_backend
    # 注意：不设置 internal:true，容器需要访问 ModelScope 下载模型
